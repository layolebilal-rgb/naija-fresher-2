<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* chat.js — FRONTEND. Friend replies that answer what you actually said.
   This is a rule-based "practice brain" (no internet, no AI service). It understands greetings, questions about you,
   plans to meet, money, food, class, exams, parties, fights, insults and apologies, and remembers a little.
   Real chat with real players comes later with Supabase. Used by phone.js through NF.chat.reply(contact,text,env). */
(function(){
var NF=window.NF=window.NF||{};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
var PLACES=[
 [/\b(cafe|cafeteria|canteen|bukka|eat(ing)? place)\b/,'Cafeteria'],[/\blibrary\b/,'Main Library'],[/\b(market|stalls?)\b/,'Campus Market'],[/\bpark\b/,'Campus Park'],
 [/\b(sports|pitch|field|football|stadium)\b/,'Sports Complex'],[/\bmosque\b/,'Central Mosque'],[/\b(chapel|church)\b/,'Chapel'],[/\bbook ?shop\b/,'Bookshop'],
 [/\b(clinic|medical|hospital|sick bay)\b/,'Medical Centre'],[/\bbank\b/,'Campus Bank'],[/\b(gate|main gate)\b/,'Main Gate'],[/\b(lt ?1|lecture theatre 1)\b/,'Lecture Theatre 1'],
 [/\b(lt ?2|lecture theatre 2)\b/,'Lecture Theatre 2'],[/\bsenate\b/,'Senate Building'],[/\badmin\b/,'Admin Block'],[/\b(computer science|csc)\b/,'Computer Science'],
 [/\bsocial science\b/,'Faculty of Social Science'],[/\blaw (faculty|building)|faculty of law\b/,'Faculty of Law'],[/\bengineering\b/,'Faculty of Engineering'],[/\bairport\b/,'Airport Terminal']];
function placeIn(t){for(var i=0;i<PLACES.length;i++)if(PLACES[i][0].test(t))return PLACES[i][1];return null}
function clock(m){m=Math.floor(m)%1440;var h=Math.floor(m/60),mm=m%60,ap=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;return h+':'+('0'+mm).slice(-2)+' '+ap}
/* each friend has a fixed personality and a weekday class pattern built from their name */
function persona(c){if(c._p)return c._p;var h=hash(c.name+c.dept);var p={temper:(c.mood==='aggressive'?60:10)+h%40,party:(h>>3)%100,study:(h>>5)%100,broke:(h>>7)%100,gist:(h>>9)%100,
  slot:[480,600,720,840,960][(h>>11)%5],slot2:[600,720,840,960,1080][(h>>13)%5]};c._p=p;return p}
function inClass(c,env){if(env.day>4)return null;var p=persona(c),m=env.min;if(m>=p.slot&&m<p.slot+120)return p.slot+120;if(m>=p.slot2&&m<p.slot2+120)return p.slot2+120;return null}
function timeWord(t){var m=t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);if(m){var h=+m[1]%12+(m[3]==='pm'?12:0);return h*60+(m[2]?+m[2]:0)}
 var d=t.match(/\bin (\d{1,3}) ?(min|mins|minutes)\b/);if(d)return {rel:+d[1]};if(/\b(now|right now|asap|immediately)\b/.test(t))return {rel:10};if(/\b(later|soon)\b/.test(t))return {rel:60};if(/\bafter (class|lecture)\b/.test(t))return {rel:90};if(/\b(tonight|evening)\b/.test(t))return 1140;return null}
var YES=/^(yes|yeah|yep|yea|ok|okay|sure|alright|fine|deal|i will|i'll come|oya|let'?s go|sounds good|bet)\b/,NO=/^(no|nope|nah|not really|i can'?t|cannot|never)\b/;
var BAD=/\b(idiot|fool|stupid|mumu|ode|dumb|useless|nonsense|bastard|shut up|werey|olodo|mad)\b/;
function nm(c){return c.name}
function reply(c,raw,env){
 env=env||{day:0,min:480,loc:null,classes:[]};var t=(raw||'').toLowerCase().trim(),p=persona(c),mem=c.mem=c.mem||{angry:0,topic:null,q:null,money:0};
 var out=function(text,act){mem.last=text;return {text:text,act:act||null}};
 var cl=inClass(c,env),tw=timeWord(t);
 /* 1. insults and apologies first */
 if(BAD.test(t)){mem.angry=2;mem.q=null;return out(pick(p.temper>55?['Who you dey call that? Watch your mouth before I forget myself.','Ehn? You want trouble? Talk to me well.']:['That was uncalled for. I am not replying until you apologise.','Wow. I thought we were cool. Apologise.']))}
 if(mem.angry>0){if(/\b(sorry|apolog|forgive|my bad|i didn'?t mean)\b/.test(t)){if(Math.random()<.6||p.temper<40){mem.angry=0;return out(pick(['Hmm okay. Don\'t do that again.','Fine, apology accepted. We move.']))}mem.angry=1;return out('I hear you, but I\'m still vexed. Give me time.')}
  return out(mem.angry>1?'I\'m not talking to you till you apologise.':'Still vexed o. Say sorry properly.')}
 /* 2. answer a question I asked before */
 if(mem.q==='where'){var pl=placeIn(t);if(pl){mem.q=null;return meet(pl)}if(NO.test(t)){mem.q=null;return out('Okay, no wahala. Just tell me when you\'re free.')}}
 if(mem.q==='confirm'&&mem.plan){if(YES.test(t)){mem.q=null;var pl2=mem.plan;mem.plan=null;return meet(pl2,true)}if(NO.test(t)){mem.q=null;mem.plan=null;return out('Alright. Another time then.')}}
 if(mem.q==='lend'){if(YES.test(t)||/\b(thank|thanks)\b/.test(t)){mem.q=null;return out('Alright. Pay me back before the weekend o.')}if(NO.test(t)){mem.q=null;return out('Okay. I understand.')}}
 /* 3. greetings and small talk */
 if(/^(hi|hello|hey|yo|hiya|good (morning|afternoon|evening))\b/.test(t)||/\b(how far|wassup|what'?s up|how you dey)\b/.test(t)&&t.length<30){
  if(cl)return out('Hey! I\'m in lecture till '+clock(cl)+', so I\'ll reply short. What\'s up?');
  var h=Math.floor(env.min/60);return out(pick([h<12?'Good morning! You\'re up early. Class today?':h<17?'Hey! How\'s your day going so far?':'Good evening! Long day?','Hello! I was about to text you. Where are you now?','Hey hey. How far with school?']))}
 if(/how (are|r) (you|u)|how (is|\'s) (school|body|life)|how('s| is) your day|you good\??$/.test(t)){
  var mood=cl?'in class, struggling to stay awake':pick(['a bit tired, my lecturer has been heavy','fine, just managing my money','good, I just ate','stressed about assignments']);return out('I\'m '+mood+'. You?')}
 if(/(where (are|r) (you|u)|where you dey|your location)/.test(t)){if(cl)return out('I\'m in class till '+clock(cl)+'.');var l=env.friendLoc;return out(l?'I\'m around '+l+'.':pick(['I\'m around the hostels now.','Just walking around campus. Why?']))}
 if(/(what (are|r) (you|u) doing|wyd|what you dey do|busy\??)/.test(t)){return out(cl?'In class, pretending to listen 😅 free at '+clock(cl)+'.':pick(['Nothing much. Just relaxing. Any plan?','Reading small. What\'s up?','I just came out of lecture. Why?']))}
 if(/(what('s| is) your (name)|who (are|r) you)/.test(t))return out('It\'s '+nm(c)+'. Remember? '+c.lvl+' level '+c.dept+'.');
 if(/(which|what) (course|dept|department|faculty|level)|what do you study|\byour (dept|level)\b/.test(t))return out('I\'m in '+c.dept+', '+c.lvl+' level. And you?');
 /* 4. plans to meet */
 var pl3=placeIn(t),wantMeet=/\b(meet|come|link|see you|hang ?out|join me|let'?s (go|meet|link|chill)|chill|come over|i('m| am) at|pull up|come down)\b/.test(t);
 if(wantMeet||(pl3&&/\b(at|to|in)\b/.test(t)&&/\b(you|u|we|let)\b/.test(t))){
  if(cl&&!(tw&&tw.rel&&tw.rel>=cl-env.min))return out('I\'m in class till '+clock(cl)+'. After that I can meet you'+(pl3?' at '+pl3:'')+'. Is that fine?',null,mem.q='confirm',mem.plan=pl3||null);
  if(!pl3){mem.q='where';return out(pick(['Where exactly? Tell me the place.','Sure. Which place — cafeteria, library, park?']))}
  return meet(pl3)}
 function meet(place,after){
  if(p.temper>85&&Math.random()<.2)return out('I\'m not in the mood to go out now.');
  var delay=(tw&&tw.rel)||(after&&cl?cl-env.min+5:Math.max(8,Math.round(8+Math.random()*12)));
  mem.q=null;return out(pick(['Alright, I\'ll be at the '+place+' in about '+delay+' minutes.','Okay. See you at the '+place+'. Give me '+delay+' minutes.','Bet. '+place+' in '+delay+' mins, don\'t keep me waiting.']),{type:'meet',place:place,delay:delay})}
 /* 5. money */
 if(/\b(lend|borrow|loan|send me|give me|i need)\b.*\b(\d{3,6}|money|cash|naira|airtime|data)\b/.test(t)||/\b(i'?m|i am) (broke|stranded)\b/.test(t)){
  var amt=(t.match(/\b(\d{3,6})\b/)||[])[1];if(p.broke>60)return out('Me? I\'m even broke myself. Allowance hasn\'t come.');
  if(amt&&+amt>3000)return out('₦'+amt+'? That\'s too much. I can do ₦1,000 at most.');mem.q='lend';return out(pick(['I can help small. But you must pay me back. Deal?','Okay, but this is the last time o. When will you pay back?']))}
 if(/\b(i (have|got) money|i\'?ll (pay|buy)|my treat|on me)\b/.test(t)){mem.q='where';return out('Ahh, then let\'s go and eat! Where?')}
 /* 6. food, class, exams, parties, fights */
 if(/\b(food|hungry|eat|rice|jollof|suya|bread|lunch|breakfast|dinner)\b/.test(t)){mem.q='confirm';mem.plan='Cafeteria';return out(pick(['I\'m hungry too. The cafeteria jollof is not bad. Should we go?','Eh, I haven\'t eaten since morning. Cafeteria?']))}
 if(/\b(exam|test|cgpa|gpa|carry ?over|assignment|project|result)\b/.test(t))return out(p.study>55?pick(['I started reading already. Want to join me at the library?','The test is close. I made notes, you can copy.']):pick(['Don\'t even remind me. I haven\'t started reading.','Wahala. I\'ll read tonight. You?']));
 if(/\b(class|lecture|lecturer|attendance|timetable|course|gst|gns)\b/.test(t)){var cls=env.classes&&env.classes[0];return out(cl?'I\'m in one now. Lecturers lock the door after 15 minutes, so don\'t be late.':cls?'You have '+cls.code+' at '+clock(cls.s)+' ('+cls.place+'), right? Don\'t be late, they lock the door.':'No class for me right now. Are you free?')}
 if(/\b(party|club|drink|beer|alcohol|chill|hang|turn up|vibe)\b/.test(t)){if(p.party>55)return out(pick(['Now you\'re talking! Where is it? Count me in.','I\'m ready. Just tell me the time and place.']));return out('I\'ll pass. I have things to do. Maybe next time.')}
 if(/\b(fight|beat|attack|slap|deal with|teach .* lesson|revenge|shank|wound|punish)\b/.test(t)){
  if(p.temper>70){mem.q='where';return out(pick(['You want to deal with somebody? I\'m in. Where do we meet first?','Ehen. Tell me who. We meet at one place first, no noise.']))}
  return out(pick(['No, no. That will get you suspended or arrested. Let it go.','I\'m not doing that. Police will pick all of us. Calm down.']))}
 if(/\b(police|security|arrest|caught|run)\b/.test(t))return out(p.temper>70?'Don\'t worry. We run if they come.':'Careful o. Don\'t get yourself in trouble.');
 if(/\b(hustle|work|gig|side ?hustle|job|make money|earn)\b/.test(t))return out(pick(['There\'s sachet water selling at the market, or serving food at the cafeteria. Check your Hustle app.','Try the cafeteria or bookshop, they always need hands. Pay is small but steady.']));
 if(/\b(love|miss you|cute|beautiful|handsome|date|crush)\b/.test(t)){return out(p.temper>70?'Hmm. Focus on your studies first 😏':pick(['Aww, that\'s sweet. Let\'s see how you behave first 😊','Hehe. Careful o, you\'ll be distracting me in class.']))}
 if(/\b(thank|thanks|tnx|appreciate)\b/.test(t))return out(pick(['You\'re welcome.','No wahala at all.','Anytime. That\'s what friends do.']));
 if(/\b(sorry|my bad)\b/.test(t))return out('No problem. What happened?');
 if(/\b(bye|later|gtg|goodnight|good night|see you)\b/.test(t))return out(env.min>1200||env.min<330?'Goodnight. Sleep well, don\'t miss your 8am.':pick(['Alright. Take care.','Okay, talk later. Don\'t forget what we discussed.']));
 if(/\b(advice|what should i|should i|help me|what do you think)\b/.test(t))return out(pick(['Tell me the full story first, then I can say something useful.','Depends. What are the options?']));
 /* 7. yes / no with no open question */
 if(YES.test(t))return out(mem.last&&/\?$/.test(mem.last)?'Okay good. So when and where?':'Okay. What next?');
 if(NO.test(t))return out('Alright then. What else is going on?');
 /* 8. questions get a direct answer attempt; statements get a relevant follow-up */
 if(/\?$/.test(t)||/^(what|why|how|when|who|where|which|can|do|did|is|are|will)\b/.test(t)){
  var w=t.match(/^(what|why|how|when|who|where|which)/);
  return out(w?pick(['Good question. I honestly don\'t know about that one. What made you ask?','I\'m not sure. Let me think and get back to you. What do you think?']):pick(['Maybe. What is the situation?','Possibly. Why do you ask?']))}
 var nouns=t.replace(/[^a-z ]/g,'').split(' ').filter(function(x){return x.length>4&&!/(about|there|their|really|which|would|should|could|because|something)/.test(x)});
 if(nouns.length)return out(pick(['You mentioned '+nouns[0]+'. What happened with that?','So what\'s the plan with '+nouns[0]+'?','Okay, and how does '+nouns[0]+' affect you?']));
 return out(pick(['I didn\'t get that fully. Say it again?','Meaning what exactly?','Okay. And then?']))}
function incoming(c,env){var p=persona(c),cl=inClass(c,env),h=Math.floor(env.min/60);
 var pool=[];if(h>=7&&h<9)pool.push('Are you up? Don\'t miss your 8am.');if(h>=12&&h<14)pool.push('Lunch time. Cafeteria?');if(h>=17)pool.push('Free now? Let\'s link at the park.');
 if(p.study>55)pool.push('Library tonight? I want to start reading for the test.');if(p.party>60)pool.push('There\'s a small gathering later. You\'re in?');if(p.broke>60)pool.push('Abeg, you have ₦500 to spare? I\'ll pay back.');
 pool.push('Where are you now?','Long time. How is school?');return pick(pool)}
NF.chat={reply:reply,incoming:incoming,placeIn:placeIn,persona:persona};
})();

</script>
<script>
/* Naija Fresher 3D - in-game phone (frontend): home screen, WhatsApp, Contacts, Wallet.
   Loaded BEFORE game.js. Talks to the game through the shared object window.NF. */
(function(){
var NF=window.NF=window.NF||{};
function $(i){return document.getElementById(i)}
function pick(a){return a[(Math.random()*a.length)|0]}
function hhmm(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var P=NF.phone={contacts:[],open:false,app:'home',cur:null};
try{P.contacts=JSON.parse(localStorage.getItem('nf_contacts_v2')||'[]')}catch(e){P.contacts=[]}
function save(){try{localStorage.setItem('nf_contacts_v2',JSON.stringify(P.contacts))}catch(e){}}
P.save=save;
function unread(){return P.contacts.reduce(function(a,c){return a+(c.unread||0)},0)}
function badge(){var n=unread(),b=$('phbadge');if(b){b.textContent=n;b.style.display=n>0?'inline-block':'none'}
 var w=document.querySelector('#ph .app[data-app=wa] .bd');if(w){w.textContent=n;w.style.display=n>0?'block':'none'}}
/* ---- bot (practice only, real players come at launch) ---- */
function botReply(c,t){if(NF.chat){var env=NF.chatEnv?NF.chatEnv(c):undefined,r=NF.chat.reply(c,t,env);if(r.act&&NF.street&&NF.street.chatAct){try{NF.street.chatAct(c,r.act)}catch(e){}}return r.text}return botReply0(c,t)}
function botReply0(c,t){t=t.toLowerCase();
 if(/\b(hi|hello|hey|yo|good (morning|afternoon|evening))\b/.test(t))return pick(['Heyy! 😄 How far?','Hello o! I was just about to text you.','Hi! Wetin dey happen?']);
 if(/(how are you|how you|how body|how far|wetin dey)/.test(t))return pick(['I dey o, just dey rush for class. You?','Body dey inside cloth 😂 you?','Doing fine, just tired from lectures.']);
 if(/(dept|department|course|study|faculty|level)/.test(t))return 'I\'m in '+c.dept+' ('+c.lvl+'L). You?';
 if(/(meet|library|hangout|hang out|come|see you|where)/.test(t))return 'Okay! Let\'s meet at '+pick(['the Library','the Cafeteria','Campus Market','the Park','the Faculty gate'])+' later 😄';
 if(/(thank|thanks)/.test(t))return pick(['No wahala!','You\'re welcome 😊','Anytime!']);
 if(/(bye|later|gtg|goodnight|good night)/.test(t))return pick(['Alright, take care! 👋','Okay o, talk later!','Bye bye 😊']);
 if(/(food|hungry|eat|rice|bread)/.test(t))return pick(['Abeg, I\'m hungry too. Let\'s go to the cafeteria!','Rice and stew? I\'m in 😂']);
 if(/(class|lecture|test|exam|read|assignment)/.test(t))return pick(['Exams are no joke o. Have you started reading?','That assignment is wahala 😩','Don\'t be late, the lecturer locks the door!']);
 if(/(love|miss|cute)/.test(t))return pick(['Aww 😊 you\'re sweet.','Hehe 😄 careful o!']);
 return pick(['😂 Really?','Hmm, tell me more.','Haha, true!','Okay o 👍','I hear you.','Wow! 😮']);}
var INC=['Where are you now?','Abeg, are you coming to class today?','Did you read for the test?','Let\'s meet at the cafeteria 😄','Long time! How far?','Check this out 😂'];
/* ---- contacts ---- */
P.add=function(n){if(n.c)return n.c;var c={name:n.name,lvl:n.lvl,dept:n.dept,num:n.num||null,friend:!!n.friend,mood:n.mood,msgs:[],unread:0};P.contacts.push(c);n.c=c;save();
 setTimeout(function(){addIncoming(c,'Hey! It\'s '+c.name+' 😊 Nice meeting you on campus.',true)},5000);return c};
function addIncoming(c,text,quiet){var m={me:false,t:text,time:hhmm()};c.msgs.push(m);save();
 if(P.open&&P.app==='chat'&&P.cur===c){addBubble(m)}else{c.unread=(c.unread||0)+1;badge();if(NF.toast&&!quiet)NF.toast('💬 '+c.name+': '+text);else if(NF.toast)NF.toast('💬 New message from '+c.name);if(P.open&&P.app==='wa')renderWA()}}
setInterval(function(){if(P.contacts.length&&Math.random()<.7){var c0=pick(P.contacts);addIncoming(c0,NF.chat?NF.chat.incoming(c0,NF.chatEnv?NF.chatEnv(c0):{day:0,min:600}):pick(INC))}},70000);
P.addIncoming=addIncoming;
/* ---- DOM ---- */
var root=document.createElement('div');root.id='ph';

<script>
/* sound.js — FRONTEND. All game sound, made live in the browser (no audio files needed).
   Footsteps, jump/land, doors, cash alerts, class bell, alarm, wind/birds/crowd, engines, plane rumble.
   Browsers only allow sound after the first tap, so it switches on by itself at your first touch. */
(function(){
var NF=window.NF=window.NF||{};
var S=NF.snd={on:true,ready:false};
try{if(localStorage.getItem('nf_snd')==='0')S.on=false}catch(e){}
var AC=null,mg=null,nb=null,amb={},eng=null,lfo=null,lastStep=-1,tBird=3,tHorn=25,tMurmur=4,volK=1;

function init(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
 mg=AC.createGain();mg.gain.value=S.on?0.9:0;mg.connect(AC.destination);
 var n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0),last=0;
 for(var i=0;i<n;i++){var w=Math.random()*2-1;last=(last+.04*w)/1.04;d[i]=last*9}   /* soft (brown-ish) noise */
 nb=b;
 function loop(freq,type,q){var s=AC.createBufferSource();s.buffer=nb;s.loop=true;var f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||.7;var g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(mg);s.start();return {g:g,f:f}}
 amb.wind=loop(380,'lowpass');amb.crowd=loop(650,'bandpass',.9);amb.room=loop(160,'lowpass');amb.fly=loop(700,'lowpass');
 var o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),am=AC.createGain();
 o.type='sawtooth';o.frequency.value=70;f.type='lowpass';f.frequency.value=380;g.gain.value=0;am.gain.value=1;
 o.connect(f);f.connect(am);am.connect(g);g.connect(mg);o.start();
 lfo=AC.createOscillator();var lg=AC.createGain();lfo.frequency.value=14;lg.gain.value=.0;lfo.connect(lg);lg.connect(am.gain);lfo.start();
 eng={o:o,f:f,g:g,am:am,lg:lg};
 S.ready=true}
['pointerdown','touchend','keydown','click'].forEach(function(ev){window.addEventListener(ev,init,{capture:true,passive:true})});

function env(g,t,a,v,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function tone(f1,f2,dur,vol,type,delay){if(!AC||!S.on)return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 env(g,t,.012,vol,dur);o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+.05)}
function puff(freq,q,dur,vol,type,delay,sweep){if(!AC||!S.on)return;var t=AC.currentTime+(delay||0),s=AC.createBufferSource();s.buffer=nb;var f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(freq,t);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+dur);f.Q.value=q||1;
 var g=AC.createGain();env(g,t,.008,vol,dur);s.connect(f);f.connect(g);g.connect(mg);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}

var SFX={
 step:function(v,ind){puff(ind?1500:420,1.1,.09,.5*v,'bandpass');puff(ind?260:150,.8,.08,.35*v,'lowpass')},
 jump:function(){tone(260,640,.16,.16,'sine');puff(900,1,.1,.08,'bandpass')},
 land:function(){puff(160,.8,.14,.55,'lowpass');tone(110,60,.12,.15,'sine')},
 click:function(){tone(1100,900,.04,.05,'square')},
 ding:function(){tone(988,988,.22,.15,'sine');tone(1319,1319,.35,.15,'sine',.1)},
 debit:function(){tone(660,660,.18,.13,'sine');tone(494,494,.3,.13,'sine',.1)},
 door:function(){puff(500,1,.35,.28,'bandpass',0,160);tone(90,55,.2,.2,'sine',.05);tone(120,80,.14,.12,'sine',.3)},
 stairs:function(){for(var i=0;i<6;i++)puff(i%2?420:320,1,.07,.3,'bandpass',i*.15)},
 sit:function(){puff(220,.8,.18,.4,'lowpass');tone(80,50,.14,.1,'sine')},
 bell:function(){for(var i=0;i<3;i++){tone(880,880,1.1,.16,'sine',i*.7);tone(1760,1760,.8,.06,'sine',i*.7);tone(660,660,1.2,.07,'sine',i*.7)}},
 alarm:function(){for(var r=0;r<3;r++)[0,.28,.56,.84].forEach(function(d){tone(1100,1100,.18,.16,'square',r*1.4+d)})},
 good:function(){[523,659,784,1047].forEach(function(f,i){tone(f,f,.25,.12,'triangle',i*.1)})},
 bad:function(){tone(180,110,.5,.16,'sawtooth');tone(160,95,.5,.12,'sawtooth',.18)},
 pop:function(){tone(700,1000,.07,.08,'sine')},
 horn:function(){tone(400,400,.22,.05,'square');tone(480,480,.22,.04,'square',.02)},
 bird:function(){var b=1800+Math.random()*1800,n=2+((Math.random()*3)|0);for(var i=0;i<n;i++)tone(b,b*(1.3+Math.random()*.4),.07,.035,'sine',i*.1)},
 hit:function(){puff(180,.8,.12,.6,'lowpass');tone(140,70,.15,.2,'sawtooth')},
 bang:function(){puff(1200,.3,.22,.9,'bandpass');puff(120,.6,.3,.7,'lowpass');tone(90,40,.3,.25,'sine')},
 siren:function(){for(var i=0;i<4;i++){tone(700,900,.35,.07,'sine',i*.7);tone(900,700,.35,.07,'sine',i*.7+.35)}},
 whoosh:function(){puff(300,.6,.9,.3,'bandpass',0,1800)}
};
S.play=function(n,v){if(!AC||!S.on||!SFX[n])return;try{SFX[n](v==null?1:v)}catch(e){}};
S.toggle=function(){S.on=!S.on;if(mg)mg.gain.value=S.on?.9:0;try{localStorage.setItem('nf_snd',S.on?'1':'0')}catch(e){}label();if(S.on){init();S.play('pop')}return S.on};
function label(){var b=document.getElementById('bsnd');if(b)b.textContent=S.on?'🔊':'🔇'}

function ramp(p,v,dt,sp){p.g.gain.value+=(v-p.g.gain.value)*Math.min(1,dt*(sp||2))}
/* called every frame by the game loop */
S.frame=function(dt,s){
 if(!AC||!S.ready)return;
 var out=!s.inside&&!s.flt&&!s.riding,hall=s.inside==='hall',host=s.inside==='hostel';
 ramp(amb.wind,out?.075:(s.riding?.05:0),dt);

var LOOK_BOY={skin:0x6b4226,hair:0x111111,hairStyle:'short',hijab:0xc0392b,top:0x3498db,bottom:0x1f2a44,shoe:0xffffff,bag:0x2c3e50,shorts:false};
var LOOK_GIRL={skin:0x7a4e2e,hair:0x111111,hairStyle:'puffs',hijab:0xc0392b,top:0xff7f50,bottom:0x2d3436,shoe:0xffffff,bag:0,shorts:false};
function screen(html){root.style.display='flex';root.innerHTML='<div class="fl">'+html+'</div>'}
function step(n,t){return '<div class="fl-step">Step '+n+' of 5 · '+t+'</div>'}
function btn(id,t,cls){return '<button class="fl-btn '+(cls||'')+'" id="'+id+'">'+t+'</button>'}
function on(id,fn){var e=$(id);if(e)e.onclick=fn}

/* ---------- screens ---------- */
function title(){var saved=null;try{saved=JSON.parse(localStorage.getItem('nf_profile')||'null')}catch(e){}
 screen('<h1>Naija <b>Fresher</b></h1><p class="fl-p">Your life as a Nigerian university student, from the first day in your hostel to the lecture hall.</p>'+btn('go','New game','go')+(saved&&saved.uni?btn('cont','Continue as '+esc(saved.short)+' · '+esc(saved.dept),''):'')+'<p class="fl-small">First you create your student, choose your university, faculty and department, and register your courses. Then your first day begins in your hostel room.</p>');
 on('go',gender);on('cont',function(){NF.profile=saved;NF.look=saved.look;begin()})}
function gender(){screen(step(1,'Who are you?')+'<h2>Boy or girl?</h2>'+btn('b','👦 Boy')+btn('g','👧 Girl'));
 on('b',function(){S.f=false;S.look=JSON.parse(JSON.stringify(LOOK_BOY));creator()});on('g',function(){S.f=true;S.look=JSON.parse(JSON.stringify(LOOK_GIRL));creator()})}
var SKIN=[0x3b2417,0x5a3a22,0x7a4e2e,0x8d5a3b,0xa9714a],HAIRC=[0x111111,0x1a1008,0x2a1a10,0x5a2d12],TOP=[0xe74c3c,0x3498db,0x2ecc71,0xf1c40f,0xffffff,0x9b59b6,0xff7f50,0x1abc9c,0xe84393],BOT=[0x1f2a44,0x2d3436,0x4a5568,0x6c5ce7,0x0a3d62,0x8a6a3c],SHOE=[0xffffff,0xd63031,0x222222,0x2d98da],BAG=[0,0x2c3e50,0xe67e22,0x16a085],HIJ=[0xc0392b,0x16a085,0x8e44ad,0xf39c12];
function sw(arr,key,val){return arr.map(function(c){return '<button class="sw'+(val===c?' on':'')+'" data-k="'+key+'" data-v="'+c+'" style="background:'+(c===0&&key==='bag'?'transparent':hx(c))+'">'+(c===0&&key==='bag'?'✕':'')+'</button>'}).join('')}
function creator(){var L=S.look,hs=S.f?['long','puffs','afro','short','hijab']:['short','afro','bald'];
 screen(step(2,'Your look')+'<div id="prev" class="fl-prev"></div><div class="fl-grp">Skin</div><div class="fl-row">'+sw(SKIN,'skin',L.skin)+'</div><div class="fl-grp">Hair style</div><div class="fl-row">'+hs.map(function(h){return '<button class="chipb'+(L.hairStyle===h?' on':'')+'" data-k="hairStyle" data-v="'+h+'">'+h+'</button>'}).join('')+'</div>'+
  (L.hairStyle==='hijab'?'<div class="fl-grp">Hijab colour</div><div class="fl-row">'+sw(HIJ,'hijab',L.hijab)+'</div>':'<div class="fl-grp">Hair colour</div><div class="fl-row">'+sw(HAIRC,'hair',L.hair)+'</div>')+
  '<div class="fl-grp">Top</div><div class="fl-row">'+sw(TOP,'top',L.top)+'</div><div class="fl-grp">Trousers / skirt</div><div class="fl-row">'+sw(BOT,'bottom',L.bottom)+'</div><div class="fl-grp">Shoes</div><div class="fl-row">'+sw(SHOE,'shoe',L.shoe)+'</div><div class="fl-grp">Bag</div><div class="fl-row">'+sw(BAG,'bag',L.bag)+'</div>'+btn('next','This is me →','go'));
 var pv=$('prev');try{pv.innerHTML=NF.charSvg?NF.charSvg(L,S.f):''}catch(e){pv.textContent=''}
 Array.prototype.forEach.call(root.querySelectorAll('[data-k]'),function(b){b.onclick=function(){var k=b.getAttribute('data-k'),v=b.getAttribute('data-v');L[k]=(k==='hairStyle')?v:parseInt(v,10);var y=root.querySelector('.fl').scrollTop;creator();root.querySelector('.fl').scrollTop=y}});
 on('next',uniPick)}
function uniPick(){screen(step(3,'University')+'<h2>Choose your university</h2><p class="fl-p">You have been admitted. Pick where you want to study.</p>'+UNIS.map(function(u,i){return '<button class="fl-btn" data-i="'+i+'"><b>'+esc(u.n)+'</b></button>'}).join('')+'<p class="fl-small">More universities will be added.</p>');
 Array.prototype.forEach.call(root.querySelectorAll('[data-i]'),function(b){b.onclick=function(){S.uni=UNIS[+b.getAttribute('data-i')];faculty()}})}
function faculty(){screen(step(4,'Faculty')+'<h2>'+esc(S.uni.n)+'</h2><p class="fl-p">Choose your faculty.</p>'+S.uni.f.map(function(f,i){return '<button class="fl-btn" data-i="'+i+'">'+esc(f)+'</button>'}).join('')+btn('bk','← Back to universities'));on('bk',uniPick);
 Array.prototype.forEach.call(root.querySelectorAll('[data-i]'),function(b){b.onclick=function(){S.fac=S.uni.f[+b.getAttribute('data-i')];dept()}})}
function dept(){var ds=deptsOf(S.fac);screen(step(4,'Department')+'<h2>'+esc(S.fac)+'</h2><p class="fl-p">Choose your department.</p>'+ds.map(function(d,i){return '<button class="fl-btn" data-i="'+i+'">'+esc(d)+'</button>'}).join('')+btn('bk','← Back to faculty'));
 Array.prototype.forEach.call(root.querySelectorAll('[data-i]'),function(b){b.onclick=function(){S.dept=ds[+b.getAttribute('data-i')];register()}});on('bk',faculty)}
function register(){var cs=coursesOf(S.dept,S.fac);S.courses=cs;S.tt=buildTT(cs,S.uni.n+S.dept+(S.f?'f':'m'));
 screen(step(5,'Course registration')+'<h2>100 Level · '+esc(S.dept)+'</h2><p class="fl-p">'+esc(S.uni.n)+'<br>'+esc(S.fac)+'</p><div class="fl-grp">Your registered courses</div>'+cs.map(function(c){return '<div class="fl-course"><b>'+esc(c.code)+'</b> '+esc(c.name)+'<span>'+c.n+' class'+(c.n>1?'es':'')+' a week · '+esc(c.lec)+'</span></div>'}).join('')+'<p class="fl-small">'+S.tt.length+' classes a week. Your timetable is in the Timetable app on your phone. Classes start at 8:00 AM, so set your alarm.</p>'+'<div class="fl-grp">Choose your life</div><div class="fl-row"><button class="chipb on" id="pg">😇 Good student</button><button class="chipb" id="pb">😈 Gangster life</button></div><p class="fl-small" id="pdesc"></p>'+btn('reg','Register and start Day 1','go'));
 S.path=S.path||'good';
 function pset(p){S.path=p;$('pg').classList.toggle('on',p==='good');$('pb').classList.toggle('on',p==='bad');$('pdesc').textContent=p==='good'?'Study, make friends, hustle honestly. Bullies may shout at you, but you can walk away or answer back.':'Roll with the boys, fight with a stick or a gun, call your friends to attack together. The police will chase you, and you can be arrested, fined and suspended.'}
 on('pg',function(){pset('good')});on('pb',function(){pset('bad')});pset(S.path);
 on('reg',function(){if(S.path==='bad'){S.look.top=0x15151b;S.look.bottom=0x23232b;S.look.shoe=0x111111;S.look.bag=0;if(S.look.hairStyle==='hijab')S.look.hijab=0x15151b}NF.profile={path:S.path,f:S.f,uni:S.uni.n,short:S.uni.s,tier:S.uni.t,fac:S.fac,dept:S.dept,courses:S.courses,tt:S.tt,look:S.look};NF.look=S.look;try{localStorage.setItem('nf_profile',JSON.stringify(NF.profile))}catch(e){}begin()})}
function begin(){var P=NF.profile;root.style.display='none';root.innerHTML='';if(NF.applyLook)NF.applyLook(P.look,P.f);NF.startGame(P.f)}
NF.flowStart=title;title();
})();

</script>

</body></html>
